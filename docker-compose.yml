# Local development stack: Temporal + API + Worker.
# Brings the platform up end-to-end with a single command.
services:
  temporal:
    image: temporalio/auto-setup:1.24
    container_name: temporal
    environment:
      - DB=sqlite
      - SQLITE_PATH=/etc/temporal/temporal.db
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-ui:
    image: temporalio/ui:2.27.2
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: coding-agent-api
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: coding-agent-worker
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2
