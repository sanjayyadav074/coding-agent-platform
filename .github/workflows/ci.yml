name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/coding_agent[dev]
      - name: Ruff
        run: ruff check packages services
      - name: Mypy
        run: mypy packages/coding_agent/src
      - name: Pytest
        working-directory: packages/coding_agent
        run: pytest -q --cov=coding_agent --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/coding_agent/coverage.xml

  docker:
    name: build images
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          tags: coding-agent-api:ci
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/worker/Dockerfile
          push: false
          tags: coding-agent-worker:ci

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - run: helm lint deploy/helm/coding-agent
      - run: helm template coding-agent deploy/helm/coding-agent | tee /tmp/manifests.yaml
      - uses: instrumenta/kubeval-action@master
        continue-on-error: true
        with:
          files: /tmp/manifests.yaml

  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0
      - working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate