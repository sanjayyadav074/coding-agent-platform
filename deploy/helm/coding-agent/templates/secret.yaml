{{- if not .Values.externalSecret.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coding-agent.fullname" . }}-secrets
  labels: {{- include "coding-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- else -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "coding-agent.fullname" . }}-secrets
  labels: {{- include "coding-agent.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "coding-agent.fullname" . }}-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteName | quote }}
{{- end -}}
